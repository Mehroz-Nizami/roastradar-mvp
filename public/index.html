<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RoastRadar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f2e6;
    --surface: #ffffff;
    --surface-2: #f3ecd9;
    --ink: #241f14;
    --ink-soft: #7d715a;
    --ink-faint: #a89f8c;
    --brand: #b8952f;
    --brand-dark: #967a22;
    --espresso: #211c12;
    --espresso-2: #322a18;
    --cream: #f3ecd9;
    --risk: #c5453e;
    --risk-bg: #fbeae8;
    --ok: #3e8460;
    --ok-bg: #e9f4ec;
    --gold: #e8c468;
    --line: #e8ddc4;
    --radius: 16px;
    --shadow-sm: 0 1px 2px rgba(36,31,20,0.06), 0 1px 3px rgba(36,31,20,0.08);
    --shadow-md: 0 4px 14px rgba(36,31,20,0.10), 0 2px 4px rgba(36,31,20,0.06);
    --shadow-lg: 0 20px 40px rgba(36,31,20,0.18), 0 6px 12px rgba(36,31,20,0.08);
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      radial-gradient(circle at 8% 0%, rgba(184,149,47,0.08), transparent 45%),
      radial-gradient(circle at 95% 15%, rgba(232,196,104,0.12), transparent 40%),
      var(--bg);
    color: var(--ink);
    margin: 0;
    min-height: 100vh;
  }
  h1, h2, h3 { font-family: 'Sora', 'Inter', sans-serif; }

  header {
    background: linear-gradient(155deg, var(--espresso) 0%, var(--espresso-2) 100%);
    color: #f5ede1;
    padding: 1.1rem 1.75rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 0.65rem; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(145deg, var(--brand), var(--gold));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(232,196,104,0.4);
    flex-shrink: 0;
  }
  .brand-text h1 { margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: -0.01em; }
  .brand-text p { margin: 0; font-size: 0.72rem; color: #c8b98a; letter-spacing: 0.02em; }

  header .actions { display: flex; align-items: center; gap: 0.5rem; }
  header .actions button {
    background: var(--brand);
    border: none; color: #211c12; padding: 0.55rem 1.05rem; border-radius: 999px;
    font-weight: 700; font-size: 0.85rem; cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    box-shadow: 0 2px 6px rgba(184,149,47,0.35);
  }
  header .actions button:hover { transform: translateY(-1px); background: var(--gold); box-shadow: 0 4px 10px rgba(232,196,104,0.5); }
  header .actions button.secondary { background: rgba(255,255,255,0.08); color: #f5ede1; box-shadow: none; border: 1px solid rgba(255,255,255,0.18); font-weight: 600; }
  header .actions button.secondary:hover { background: rgba(255,255,255,0.16); }

  main { max-width: 1180px; margin: 0 auto; padding: 2rem 1.75rem 3rem; }

  .page-heading { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem; }
  .page-heading h2 { margin: 0; font-size: 1.4rem; font-weight: 700; }
  .page-heading .sub { margin: 0.15rem 0 0; color: var(--ink-soft); font-size: 0.9rem; }
  .summary-pill { display: flex; gap: 0.6rem; }
  .summary-pill .chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0.4rem 0.85rem; font-size: 0.78rem; color: var(--ink-soft); box-shadow: var(--shadow-sm); }
  .summary-pill .chip b { color: var(--brand-dark); }

  .alerts-bar { display: none; margin-bottom: 1.75rem; }
  .alerts-bar.show { display: block; animation: fadeSlide 0.35s ease; }
  .alerts-bar h2 { margin: 0 0 0.7rem; font-size: 0.95rem; color: var(--risk); display: flex; align-items: center; gap: 0.4rem; font-family: 'Inter', sans-serif; font-weight: 700; }
  .alerts-row { display: flex; gap: 0.7rem; flex-wrap: wrap; }
  .alert-chip {
    background: var(--surface); border: 1px solid #f0c9c5; border-left: 4px solid var(--risk);
    border-radius: 0 12px 12px 0; padding: 0.65rem 0.9rem; cursor: pointer; box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease, box-shadow 0.15s ease; min-width: 200px;
  }
  .alert-chip:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .alert-chip .name { font-weight: 700; font-size: 0.86rem; color: var(--ink); }
  .alert-chip .detail { font-size: 0.76rem; color: var(--ink-soft); margin-top: 0.15rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(295px, 1fr)); gap: 1.15rem; }

  .card {
    background: var(--surface); border-radius: var(--radius); padding: 1.35rem;
    box-shadow: var(--shadow-sm); border: 1px solid var(--line); cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    animation: fadeUp 0.4s ease both;
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: #d9c68d; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
  .card h3 { margin: 0; font-size: 1.05rem; font-weight: 700; line-height: 1.3; color: var(--ink); }
  .card .variety { color: var(--ink-soft); font-size: 0.82rem; margin: 0.2rem 0 0.9rem; }

  .badge { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.7rem; font-weight: 700; padding: 0.28rem 0.6rem; border-radius: 999px; white-space: nowrap; }
  .badge.risk { background: var(--risk-bg); color: var(--risk); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.nodata { background: var(--surface-2); color: var(--ink-faint); }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .meta-row { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 0.35rem; }

  .gauge-wrap { margin-top: 0.95rem; }
  .gauge-labels { display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--ink-soft); margin-bottom: 0.35rem; }
  .gauge-labels b { color: var(--ink); font-size: 0.82rem; }
  .gauge { position: relative; height: 9px; background: var(--surface-2); border-radius: 999px; overflow: visible; }
  .gauge-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }
  .gauge-fill.risk { background: linear-gradient(90deg, #d9645c, var(--risk)); }
  .gauge-fill.ok { background: linear-gradient(90deg, #57a37c, var(--ok)); }
  .gauge-fill.nodata { background: repeating-linear-gradient(135deg, #e5dabc, #e5dabc 4px, #eee4ce 4px, #eee4ce 8px); }
  .gauge-marker { position: absolute; top: -4px; width: 2px; height: 17px; background: var(--espresso); border-radius: 1px; }
  .gauge-marker::after { content: 'reorder by'; position: absolute; top: 19px; left: 50%; transform: translateX(-50%); font-size: 0.62rem; color: var(--ink-faint); white-space: nowrap; }

  .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1.15rem; padding-top: 0.85rem; border-top: 1px dashed var(--line); }
  .card-footer .value { font-size: 0.78rem; color: var(--ink-soft); }
  .card-footer .value b { color: var(--brand-dark); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(33,28,18,0.55);
    backdrop-filter: blur(3px); align-items: center; justify-content: center; z-index: 10;
  }
  .modal-overlay.show { display: flex; animation: fadeSlide 0.2s ease; }
  .modal {
    background: var(--surface); border-radius: 18px; padding: 1.75rem; width: 440px;
    max-width: 90vw; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow-lg);
    animation: modalIn 0.22s cubic-bezier(.2,.9,.3,1.2);
  }
  .modal h2 { margin-top: 0; font-size: 1.2rem; font-weight: 700; color: var(--ink); }
  .modal label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--ink-soft); margin: 0.75rem 0 0.3rem; }
  .modal input, .modal textarea {
    width: 100%; padding: 0.6rem 0.7rem; border-radius: 9px; border: 1px solid var(--line);
    font-size: 0.9rem; font-family: inherit; background: var(--bg); transition: border-color 0.15s ease;
  }
  .modal input:focus, .modal textarea:focus { outline: none; border-color: var(--brand); background: var(--surface); }
  .modal textarea { font-family: 'SFMono-Regular', Menlo, monospace; font-size: 0.82rem; min-height: 170px; }
  .modal-actions { margin-top: 1.35rem; display: flex; gap: 0.5rem; justify-content: flex-end; flex-wrap: wrap; }
  .modal-actions button {
    padding: 0.55rem 1rem; border-radius: 9px; border: none; cursor: pointer; font-weight: 600; font-size: 0.85rem;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .modal-actions button:hover { transform: translateY(-1px); }
  .modal-actions button.primary { background: var(--brand); color: #211c12; box-shadow: 0 2px 6px rgba(184,149,47,0.35); }
  .modal-actions button.danger { background: var(--risk-bg); color: var(--risk); }
  .modal-actions button.plain { background: var(--surface-2); color: var(--ink); }
  .reason { font-size: 0.83rem; color: var(--ink); background: var(--surface-2); padding: 0.7rem 0.85rem; border-radius: 10px; margin-top: 0.7rem; line-height: 1.45; border-left: 3px solid var(--brand); }
  .usage-log { font-size: 0.82rem; color: var(--ink-soft); border-top: 1px solid var(--line); padding: 0.4rem 0; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-mark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="12" cy="12" rx="9" ry="10" fill="#211c12"/>
        <path d="M12 3C10 7 10 17 12 21" stroke="#f5ede1" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>RoastRadar</h1>
      <p>Green coffee inventory &amp; reorder alerts</p>
    </div>
  </div>
  <div class="actions">
    <button class="secondary" id="resetBtn">Reset demo data</button>
    <button id="newLotBtn">+ New lot</button>
    <button class="secondary" id="logoutBtn">Log out</button>
  </div>
</header>
<main>
  <div class="page-heading">
    <div>
      <h2>Lot dashboard</h2>
      <p class="sub">Sorted worst-first - lots closest to a stockout come first.</p>
    </div>
    <div class="summary-pill" id="summaryPill"></div>
  </div>

  <div class="alerts-bar" id="alertsBar">
    <h2 id="alertsTitle"></h2>
    <div class="alerts-row" id="alertsList"></div>
  </div>
  <div class="grid" id="lotGrid"></div>
</main>

<div class="modal-overlay" id="lotModalOverlay">
  <div class="modal" id="lotModal"></div>
</div>

<script src="app.js"></script>
</body>
</html>
