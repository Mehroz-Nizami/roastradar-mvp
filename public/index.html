<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RoastRadar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f6f1ea; color: #2a1f18; margin: 0; }
  header { background: #2a1f18; color: #f5ede4; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 1.3rem; }
  header .actions button { background: #c17a3a; border: none; color: #1c1410; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; margin-left: 0.5rem; }
  header .actions button.secondary { background: transparent; border: 1px solid #6b5847; color: #f5ede4; }
  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
  .alerts-bar { background: #fdecec; border: 1px solid #e5a3a3; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; display: none; }
  .alerts-bar.show { display: block; }
  .alerts-bar h2 { margin: 0 0 0.5rem; font-size: 1rem; color: #a13d3d; }
  .alerts-bar ul { margin: 0; padding-left: 1.2rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
  .card { background: white; border-radius: 10px; padding: 1.1rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-left: 5px solid #7fae7f; cursor: pointer; }
  .card.risk { border-left-color: #d15c5c; }
  .card h3 { margin: 0 0 0.15rem; font-size: 1.05rem; }
  .card .variety { color: #7a6a58; font-size: 0.85rem; margin-bottom: 0.6rem; }
  .card .stat-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.25rem; color: #4a3a2c; }
  .card .stat-row b { color: #1c1410; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; margin-top: 0.5rem; }
  .badge.risk { background: #fdecec; color: #a13d3d; }
  .badge.ok { background: #eaf5ea; color: #3d7a3d; }
  .badge.nodata { background: #f0ece5; color: #7a6a58; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; z-index: 10; }
  .modal-overlay.show { display: flex; }
  .modal { background: white; border-radius: 10px; padding: 1.5rem; width: 420px; max-width: 90vw; max-height: 85vh; overflow-y: auto; }
  .modal h2 { margin-top: 0; font-size: 1.15rem; }
  .modal label { display: block; font-size: 0.8rem; color: #7a6a58; margin: 0.6rem 0 0.2rem; }
  .modal input, .modal textarea { width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #d8cbba; font-size: 0.9rem; }
  .modal textarea { font-family: monospace; min-height: 160px; }
  .modal-actions { margin-top: 1.2rem; display: flex; gap: 0.5rem; justify-content: flex-end; }
  .modal-actions button { padding: 0.5rem 1rem; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
  .modal-actions button.primary { background: #c17a3a; color: #1c1410; }
  .modal-actions button.danger { background: #d15c5c; color: white; }
  .modal-actions button.plain { background: #eee; color: #333; }
  .reason { font-size: 0.82rem; color: #5a4a3a; background: #f6f1ea; padding: 0.6rem; border-radius: 6px; margin-top: 0.6rem; }
  .usage-log { font-size: 0.8rem; color: #7a6a58; border-top: 1px solid #eee; padding: 0.3rem 0; }
</style>
</head>
<body>
<header>
  <h1>🌱 RoastRadar</h1>
  <div class="actions">
    <button class="secondary" id="resetBtn">Reset demo data</button>
    <button id="newLotBtn">+ New lot</button>
    <button class="secondary" id="logoutBtn">Log out</button>
  </div>
</header>
<main>
  <div class="alerts-bar" id="alertsBar">
    <h2 id="alertsTitle"></h2>
    <ul id="alertsList"></ul>
  </div>
  <div class="grid" id="lotGrid"></div>
</main>

<div class="modal-overlay" id="lotModalOverlay">
  <div class="modal" id="lotModal"></div>
</div>

<script src="app.js"></script>
</body>
</html>
