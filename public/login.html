<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RoastRadar — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(217,164,65,0.16), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(181,101,29,0.14), transparent 45%),
      linear-gradient(160deg, #1c1410, #2a1f18);
    color: #f5ede4; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;
  }
  .card {
    background: rgba(42,31,24,0.85); backdrop-filter: blur(6px);
    padding: 2.75rem 2.5rem; border-radius: 20px; width: 340px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.08);
  }
  .mark {
    width: 46px; height: 46px; border-radius: 13px; margin-bottom: 1.1rem;
    background: linear-gradient(145deg, #b5651d, #d9a441);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(217,164,65,0.35);
  }
  h1 { font-family: 'Sora', sans-serif; margin: 0 0 0.3rem; font-size: 1.45rem; font-weight: 700; letter-spacing: -0.01em; }
  p.sub { color: #b8a894; margin: 0 0 1.75rem; font-size: 0.88rem; }
  label { display: block; font-size: 0.75rem; font-weight: 600; color: #b8a894; margin-bottom: 0.35rem; }
  input {
    width: 100%; box-sizing: border-box; padding: 0.75rem 0.85rem; border-radius: 10px;
    border: 1px solid #4a3a2c; background: #1c1410; color: #f5ede4; margin-bottom: 1.1rem; font-size: 0.95rem;
    transition: border-color 0.15s ease;
  }
  input:focus { outline: none; border-color: #d9a441; }
  button {
    width: 100%; padding: 0.8rem; border-radius: 10px; border: none;
    background: linear-gradient(135deg, #c17a3a, #b5651d); color: white; font-weight: 700; font-size: 0.95rem; cursor: pointer;
    box-shadow: 0 4px 12px rgba(181,101,29,0.4); transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(181,101,29,0.5); }
  .error { color: #e8938c; font-size: 0.85rem; min-height: 1.2rem; margin-top: 0.75rem; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="12" cy="12" rx="9" ry="10" fill="#2a1f18"/>
        <path d="M12 3C10 7 10 17 12 21" stroke="#f5ede1" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>RoastRadar</h1>
    <p class="sub">Green coffee inventory &amp; reorder alerts</p>
    <form id="loginForm">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" autofocus />
      <button type="submit">Log in</button>
      <div class="error" id="error"></div>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      if (res.ok) {
        window.location.href = '/';
      } else {
        document.getElementById('error').textContent = 'Incorrect password';
      }
    });
  </script>
</body>
</html>
