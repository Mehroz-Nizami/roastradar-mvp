<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RoastRadar — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1c1410; color: #f5ede4; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .card { background: #2a1f18; padding: 2.5rem; border-radius: 12px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
  h1 { margin: 0 0 0.25rem; font-size: 1.4rem; }
  p.sub { color: #b8a894; margin: 0 0 1.5rem; font-size: 0.9rem; }
  input { width: 100%; box-sizing: border-box; padding: 0.7rem; border-radius: 8px; border: 1px solid #4a3a2c; background: #1c1410; color: #f5ede4; margin-bottom: 1rem; font-size: 1rem; }
  button { width: 100%; padding: 0.7rem; border-radius: 8px; border: none; background: #c17a3a; color: #1c1410; font-weight: 600; font-size: 1rem; cursor: pointer; }
  button:hover { background: #d68a45; }
  .error { color: #e08a8a; font-size: 0.85rem; min-height: 1.2rem; margin-top: 0.5rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>🌱 RoastRadar</h1>
    <p class="sub">Green coffee inventory & reorder alerts</p>
    <form id="loginForm">
      <input type="password" id="password" placeholder="Password" autofocus />
      <button type="submit">Log in</button>
      <div class="error" id="error"></div>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      if (res.ok) {
        window.location.href = '/';
      } else {
        document.getElementById('error').textContent = 'Incorrect password';
      }
    });
  </script>
</body>
</html>
